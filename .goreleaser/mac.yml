version: 1

project_name: katana

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod tidy

builds:
  - id: katana-darwin
    main: ./cmd/katana/main.go
    binary: katana
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w

archives:
  - format: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_macOS_{{ .Arch }}

checksum:
  name_template: "{{ .ProjectName }}-mac-checksums.txt"

release:
  disable: true
